  <style>
    /* ==========================================================================
       SAN3A ACADEMY BRAND SYSTEM & TOKENS
       ========================================================================== */
    :root {
      color-scheme: dark;
      /* Core dark surfaces */
      --san3a-bg: #120810;
      --san3a-ink: #F7EDF2;
      --san3a-maroon-d: #E8C9D6;
      --san3a-wine: #FF8FA3;
      --san3a-red: #FF5A63;
      --san3a-paper: #1E1019;
      --san3a-white: #2A1522;
      --san3a-sun: #FFD166;
      --san3a-teal: #3DDBC9;
      --san3a-border: rgba(247, 237, 242, 0.10);
      --san3a-border-strong: rgba(247, 237, 242, 0.18);
      --san3a-on-accent: #1A0A12;
      --san3a-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --san3a-shadow-hover: 0 18px 40px rgba(0, 0, 0, 0.6);
      --border-radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--san3a-bg);
      color: var(--san3a-ink);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    h1, h2, h3, h4, .brand-heading {
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Top Accent Stripe */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--san3a-teal), var(--san3a-wine), var(--san3a-red), var(--san3a-sun));
      z-index: 1000;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ==========================================================================
       HEADER & BRAND LOCKUP
       ========================================================================== */
    header {
      background: linear-gradient(135deg, #0C0509, #26101B);
      color: var(--san3a-ink);
      padding: 32px 0 28px;
      box-shadow: var(--san3a-shadow);
      margin-bottom: 32px;
      border-bottom: 1px solid var(--san3a-border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-slot {
      height: 54px;
      display: flex;
      align-items: center;
    }

    .logo-slot img {
      height: 54px;
      object-fit: contain;
    }

    .brand-text h1 {
      font-size: 26px;
      font-weight: 900;
      color: var(--san3a-ink);
      line-height: 1.1;
    }

    .brand-text h1 span {
      color: var(--san3a-red);
    }

    .brand-tagline {
      font-size: 12px;
      color: var(--san3a-sun);
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 2px;
    }

    .refresh-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }

    .btn-action {
      background: var(--san3a-red);
      color: var(--san3a-on-accent);
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-action:hover {
      background: var(--san3a-wine);
      transform: translateY(-1px);
    }

    .btn-action.btn-secondary {
      background: rgba(255, 255, 255, 0.10);
      color: var(--san3a-ink);
      border: 1px solid var(--san3a-border-strong);
    }

    .btn-action.btn-secondary:hover {
      background: var(--san3a-sun);
      color: var(--san3a-on-accent);
      border-color: var(--san3a-sun);
    }

    /* ==========================================================================
       FILTER CONTROLS BAR
       ========================================================================== */
    .controls-card {
      background: var(--san3a-white);
      border-radius: var(--border-radius);
      padding: 20px 24px;
      box-shadow: var(--san3a-shadow);
      margin-bottom: 32px;
      border: 1px solid var(--san3a-border);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--san3a-maroon-d);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--san3a-border-strong);
      background: var(--san3a-paper);
      color: var(--san3a-ink);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
      color-scheme: dark;
    }

    select option {
      background: var(--san3a-paper);
      color: var(--san3a-ink);
    }

    input[type="text"]::placeholder {
      color: rgba(247, 237, 242, 0.4);
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--san3a-red);
      background: var(--san3a-white);
    }

    /* ==========================================================================
       STATS TILES & BADGES
       ========================================================================== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--san3a-white);
      border-radius: var(--border-radius);
      padding: 20px 24px;
      box-shadow: var(--san3a-shadow);
      border-top: 5px solid var(--san3a-red);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-card.sun { border-top-color: var(--san3a-sun); }
    .stat-card.teal { border-top-color: var(--san3a-teal); }

    .stat-value {
      font-size: 36px;
      font-weight: 900;
      color: var(--san3a-ink);
      line-height: 1.1;
      font-family: 'Montserrat', sans-serif;
    }

    .stat-label {
      font-size: 13px;
      color: var(--san3a-maroon-d);
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Activity Chips */
    .chip {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .chip-home { background: var(--san3a-teal); color: var(--san3a-on-accent); }
    .chip-inclass { background: var(--san3a-red); color: var(--san3a-on-accent); }
    .chip-bonus { background: var(--san3a-sun); color: var(--san3a-on-accent); }
    .chip-other { background: #FDBA74; color: var(--san3a-on-accent); }
    .chip-group { background: var(--san3a-sun); color: var(--san3a-on-accent); }

    /* ==========================================================================
       PROFILE BANNERS
       ========================================================================== */
    .profile-banner {
      background: var(--san3a-white);
      border-radius: var(--border-radius);
      padding: 28px;
      box-shadow: var(--san3a-shadow);
      margin-bottom: 32px;
      border-left: 8px solid var(--san3a-red);
      position: relative;
    }

    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .profile-title-area h1 {
      font-size: 32px;
      color: var(--san3a-ink);
      font-weight: 900;
      margin-top: 6px;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--san3a-paper);
      color: var(--san3a-maroon-d);
      border: 1px solid var(--san3a-border-strong);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 4px;
    }

    .btn-back-home:hover {
      background: var(--san3a-red);
      color: var(--san3a-on-accent);
      border-color: var(--san3a-red);
    }

    .type-breakdown {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .type-count-pill {
      background: var(--san3a-paper);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--san3a-maroon-d);
      border: 1px solid var(--san3a-border);
    }

    /* ==========================================================================
       OVERVIEW & RECENT FEED
       ========================================================================== */
    .section-title-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 22px;
      color: var(--san3a-ink);
      font-weight: 800;
    }

    .feed-grid {
      display: grid;
      gap: 16px;
    }

    .feed-card {
      background: var(--san3a-white);
      border-radius: var(--border-radius);
      padding: 18px 24px;
      box-shadow: var(--san3a-shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border-left: 5px solid var(--san3a-red);
    }

    .feed-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--san3a-shadow-hover);
    }

    .feed-student {
      font-weight: 700;
      font-size: 16px;
      color: var(--san3a-ink);
    }

    .feed-meta {
      font-size: 13px;
      color: var(--san3a-wine);
    }

    .feed-activity {
      font-weight: 600;
      font-size: 15px;
      color: var(--san3a-maroon-d);
    }

    /* ==========================================================================
       STUDENT PORTFOLIO & SIDE-BY-SIDE CODE/MEDIA GRID
       ========================================================================== */
    .portfolio-stack {
      display: grid;
      gap: 24px;
    }

    .submission-card {
      background: var(--san3a-white);
      border-radius: var(--border-radius);
      padding: 28px;
      box-shadow: var(--san3a-shadow);
      border: 1px solid var(--san3a-border);
    }

    .sub-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--san3a-border);
    }

    .sub-card-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--san3a-ink);
    }

    .sub-card-date {
      font-size: 12px;
      color: var(--san3a-wine);
      font-weight: 500;
    }

    .sub-description {
      font-size: 15px;
      color: var(--san3a-maroon-d);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* Code & Media Side-by-Side Grid Layout */
    .sub-content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 16px;
    }

    @media (min-width: 820px) {
      .sub-content-grid.has-both {
        grid-template-columns: 1.3fr 1fr; /* Code on Left, Photos on Right */
        align-items: start;
      }
    }

    /* Code Block Formatting */
    .code-block-wrap {
      position: relative;
    }

    .code-header {
      background: #0B0409;
      color: var(--san3a-sun);
      padding: 8px 16px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--san3a-border);
      border-bottom: none;
    }

    .btn-copy {
      background: var(--san3a-wine);
      color: var(--san3a-on-accent);
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: var(--san3a-red);
    }

    pre.code-block {
      background: #0B0409;
      color: #FFE6E9;
      padding: 18px;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      font-size: 13.5px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border-left: 4px solid var(--san3a-red);
      border: 1px solid var(--san3a-border);
      border-top: none;
    }

    /* Photos Container next to Code */
    .side-photo-box {
      background: var(--san3a-paper);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--san3a-border);
    }

    .side-photo-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--san3a-maroon-d);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .photo-gallery-side {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .photo-thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
    }

    .photo-thumb-side {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid var(--san3a-border-strong);
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .photo-thumb-side:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 18px rgba(0,0,0,0.5);
    }

    .video-thumb-wrapper {
      cursor: pointer;
    }

    .video-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.28);
    }

    .video-badge-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(18, 8, 16, 0.75);
      color: var(--san3a-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .media-file-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: var(--san3a-white);
      border-radius: 10px;
      border: 1.5px dashed var(--san3a-red);
      color: var(--san3a-red);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      padding: 8px;
      text-align: center;
      transition: background 0.2s;
    }

    .media-file-link:hover {
      background: var(--san3a-paper);
    }

    /* ==========================================================================
       GROUP GRID VIEW
       ========================================================================== */
    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .student-card {
      background: var(--san3a-white);
      border-radius: var(--border-radius);
      padding: 22px;
      box-shadow: var(--san3a-shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border-top: 4px solid var(--san3a-red);
    }

    .student-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--san3a-shadow-hover);
    }

    .student-card-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--san3a-ink);
      margin-bottom: 6px;
    }

    .student-card-meta {
      font-size: 13px;
      color: var(--san3a-wine);
      margin-bottom: 12px;
    }

    /* ==========================================================================
       LIGHTBOX MODAL & UTILITIES
       ========================================================================== */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6, 3, 6, 0.92);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .lightbox iframe {
      width: min(90vw, 960px);
      height: min(85vh, 540px);
      border: none;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      background: #000;
    }

    .lightbox-close {
      position: absolute;
      top: 24px; right: 24px;
      color: var(--san3a-ink);
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }

    .lightbox-close:hover {
      color: var(--san3a-red);
    }

    .empty-state {
      background: var(--san3a-white);
      border-radius: var(--border-radius);
      padding: 48px 24px;
      text-align: center;
      color: var(--san3a-maroon-d);
      box-shadow: var(--san3a-shadow);
    }

    .empty-state h3 {
      font-size: 20px;
      color: var(--san3a-ink);
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .container { padding: 0 16px; }
      .brand-text h1 { font-size: 20px; }
      .profile-title-area h1 { font-size: 24px; }
      .submission-card { padding: 18px; }
    }

  </style>

        <div class="control-group">
          <label>5. Project Submission</label>
          <a href="https://forms.gle/xLrEQwgiiLGuLKMG8" target="_blank" rel="noreferrer" class="btn-action" style="height: 42px; justify-content: center; border-radius: 10px; font-size: 13px; background: linear-gradient(135deg, var(--san3a-red), var(--san3a-wine)); box-shadow: 0 4px 12px rgba(207, 32, 39, 0.25);">
            ➕ Submit Project
          </a>
        </div>
      </div>
    </section>

    <!-- Main Stage View -->
    <div id="dashboardStage"></div>

  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img id="lightboxImg" src="" alt="Submission photo preview">
    <iframe id="lightboxVideo" src="" style="display:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
  </div>

  <script>
    /* ==========================================================================
       DATA CONTROLLER & PARSER
       ========================================================================== */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_yIIAOieBArTnZJsRI-EgkeYp15kzD_-NTMhCw8QNocwwOO52NIj8vY6y5BOIOzQCscxy8t5bN9iA/pub?gid=1536848838&single=true&output=csv';

    let submissionsData = [];
    let state = {
      group: 'ALL',
      name: 'ALL',
      type: 'ALL',
      search: ''
    };

    // DOM Elements
    const groupSelect = document.getElementById('groupSelect');
    const nameSelect = document.getElementById('nameSelect');
    const typeSelect = document.getElementById('typeSelect');
    const searchInput = document.getElementById('searchInput');
    const stage = document.getElementById('dashboardStage');
    const refreshBtn = document.getElementById('refreshBtn');
    const lastUpdatedEl = document.getElementById('lastUpdated');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxVideo = document.getElementById('lightboxVideo');

    function initializePortfolio() {
      setupEventListeners();
      fetchData();
    }

    window.addEventListener('DOMContentLoaded', initializePortfolio);

    function setupEventListeners() {
      refreshBtn.addEventListener('click', fetchData);
      
      groupSelect.addEventListener('change', (e) => {
        state.group = e.target.value;
        state.name = 'ALL';
        updateNameDropdown();
        render();
      });

      nameSelect.addEventListener('change', (e) => {
        state.name = e.target.value;
        render();
      });

      typeSelect.addEventListener('change', (e) => {
        state.type = e.target.value;
        render();
      });

      searchInput.addEventListener('input', (e) => {
        state.search = e.target.value.toLowerCase().trim();
        render();
      });

      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });
    }

    function goHome() {
      state = {
        group: 'ALL',
        name: 'ALL',
        type: 'ALL',
        search: ''
      };
      groupSelect.value = 'ALL';
      typeSelect.value = 'ALL';
      searchInput.value = '';
      updateNameDropdown();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================================================
       DATA FETCHING & MULTI-LINK PARSING
       ========================================================================== */
    function fetchData() {
      refreshBtn.disabled = true;
      refreshBtn.innerText = "⏳ Loading...";

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          refreshBtn.disabled = false;
          refreshBtn.innerText = "🔄 Refresh";
          
          const now = new Date();
          lastUpdatedEl.innerText = `Updated ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
          
          processRawData(results.data, results.meta.fields);
        },
        error: function(err) {
          refreshBtn.disabled = false;
          refreshBtn.innerText = "🔄 Retry";
          stage.innerHTML = `
            <div class="empty-state">
              <h3>⚠️ Unable to Load Submissions</h3>
              <p>Could not fetch data from the published sheet. Please check network connection.</p>
            </div>
          `;
        }
      });
    }

    function processRawData(data, headers) {
      if (!headers || headers.length === 0) return;

      const findCol = (keywords) => {
        return headers.find(h => {
          const cleanH = h.trim().toLowerCase();
          return keywords.some(k => cleanH.includes(k));
        }) || '';
      };

      const colTime = findCol(['time', 'date', 'timestamp']);
      const colGroup = findCol(['group']);
      const colName = findCol(['name']) !== findCol(['activity name']) ? findCol(['name']) : headers.find(h => h.trim().toLowerCase() === 'name');
      const colType = findCol(['activity type', 'type']);
      const colActName = findCol(['activity name', 'title']);
      const colDesc = findCol(['description', 'desc']);
      const colCode = findCol(['python', 'code']);
      const colPhoto = findCol(['photo', 'image', 'picture', 'working']);

      submissionsData = data.map((row, index) => {
        return {
          id: index,
          timestamp: row[colTime] || '',
          group: (row[colGroup] || 'Unassigned').trim(),
          name: (row[colName] || 'Anonymous').trim(),
          type: (row[colType] || 'In-class project').trim(),
          activityName: (row[colActName] || 'Untitled Activity').trim(),
          description: row[colDesc] || '',
          code: row[colCode] || '',
          photoIds: parseMultipleDriveIds(row[colPhoto] || '')
        };
      }).filter(item => item.name !== 'Anonymous' || item.code !== '');

      populateDropdowns();
      render();
    }

    // Extracts ALL Google Drive File IDs inside a cell string (handles up to 5 links)
    function parseMultipleDriveIds(rawCell) {
      if (!rawCell) return [];
      
      const idSet = new Set();
      const regex = /(?:id=|\/d\/|\/file\/d\/)([a-zA-Z0-9_-]{20,})/g;
      
      let match;
      while ((match = regex.exec(rawCell)) !== null) {
        if (match[1]) {
          idSet.add(match[1]);
        }
      }

      return Array.from(idSet);
    }

    /* ==========================================================================
       DROPDOWN MANAGERS
       ========================================================================== */
    function populateDropdowns() {
      // Groups
      const groups = [...new Set(submissionsData.map(s => s.group))]
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

      groupSelect.innerHTML = '<option value="ALL">All Groups</option>';
      groups.forEach(g => {
        groupSelect.innerHTML += `<option value="${escapeHtml(g)}">Group ${escapeHtml(g)}</option>`;
      });

      // Dynamic Activity Types
      const rawTypes = submissionsData.map(s => s.type).filter(Boolean);
      const uniqueTypes = [...new Set(rawTypes)].sort();

      typeSelect.innerHTML = '<option value="ALL">All Activity Types</option>';
      uniqueTypes.forEach(t => {
        typeSelect.innerHTML += `<option value="${escapeHtml(t)}"${state.type === t ? ' selected' : ''}>${escapeHtml(t)}</option>`;
      });

      updateNameDropdown();
    }

    function updateNameDropdown() {
      let filtered = submissionsData;
      if (state.group !== 'ALL') {
        filtered = filtered.filter(s => s.group === state.group);
      }

      const names = [...new Set(filtered.map(s => s.name))].sort();

      nameSelect.innerHTML = '<option value="ALL">All Students</option>';
      names.forEach(n => {
        nameSelect.innerHTML += `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`;
      });

      if (names.includes(state.name)) {
        nameSelect.value = state.name;
      } else {
        state.name = 'ALL';
        nameSelect.value = 'ALL';
      }
    }

    /* ==========================================================================
       RENDER CONTROLLER (ROUTER)
       ========================================================================== */
    function render() {
      let filtered = submissionsData;

      if (state.group !== 'ALL') filtered = filtered.filter(s => s.group === state.group);
      if (state.name !== 'ALL') filtered = filtered.filter(s => s.name === state.name);
      
      if (state.type !== 'ALL') {
        const targetType = state.type.toLowerCase().trim();
        filtered = filtered.filter(s => {
          const sType = (s.type || '').toLowerCase().trim();
          return sType === targetType || sType.includes(targetType) || targetType.includes(sType);
        });
      }

      if (state.search) {
        filtered = filtered.filter(s => 
          s.activityName.toLowerCase().includes(state.search) ||
          s.description.toLowerCase().includes(state.search) ||
          s.name.toLowerCase().includes(state.search)
        );
      }

      if (state.name !== 'ALL') {
        renderStudentPortfolio(state.name, filtered);
      } else if (state.group !== 'ALL') {
        renderGroupProfile(state.group, filtered);
      } else {
        renderOverview(filtered);
      }
    }

    /* ==========================================================================
       VIEW A: OVERVIEW
       ========================================================================== */
    function renderOverview(data) {
      const totalSubs = data.length;
      const activeStudents = new Set(data.map(s => s.name)).size;
      const totalGroups = new Set(data.map(s => s.group)).size;

      const recentFeed = [...data].reverse().slice(0, 10);

      stage.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${totalSubs}</div>
            <div class="stat-label">Total Submissions</div>
          </div>
          <div class="stat-card sun">
            <div class="stat-value">${activeStudents}</div>
            <div class="stat-label">Active Makers</div>
          </div>
          <div class="stat-card teal">
            <div class="stat-value">${totalGroups}</div>
            <div class="stat-label">Participating Groups</div>
          </div>
        </div>

        <div class="section-title-wrap">
          <h2 class="section-title">Recent Submissions Feed</h2>
          <span style="font-size: 13px; color: var(--san3a-wine);">Latest Activity</span>
        </div>

        ${recentFeed.length === 0 ? `
          <div class="empty-state">
            <h3>No Submissions Found</h3>
            <p>Try clearing your search query or activity type filter.</p>
          </div>
        ` : `
          <div class="feed-grid">
            ${recentFeed.map(sub => `
              <div class="feed-card" onclick="selectStudent('${escapeJs(sub.name)}', '${escapeJs(sub.group)}')">
                <div>
                  <div class="feed-student">${escapeHtml(sub.name)} <span class="chip chip-group">Group ${escapeHtml(sub.group)}</span></div>
                  <div class="feed-activity">${escapeHtml(sub.activityName)}</div>
                </div>
                <div style="text-align: right;">
                  ${getTypeChip(sub.type)}
                  <div class="feed-meta" style="margin-top: 6px;">${escapeHtml(sub.timestamp)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    /* ==========================================================================
       VIEW B: STUDENT PROFILE PORTFOLIO
       ========================================================================== */
    function renderStudentPortfolio(studentName, data) {
      const studentSubs = data.filter(s => s.name === studentName);
      
      if (studentSubs.length === 0) {
        stage.innerHTML = `
          <div class="empty-state">
            <button class="btn-back-home" onclick="goHome()">🏠 Return to Overview</button>
            <h3 style="margin-top:12px;">No submissions found for ${escapeHtml(studentName)}</h3>
            <p>Try resetting the activity type or search filter.</p>
          </div>
        `;
        return;
      }

      const groupNum = studentSubs[0].group;
      const journeySubs = [...studentSubs].sort((a, b) => a.id - b.id);

      const homeCount = studentSubs.filter(s => s.type.toLowerCase().includes('home')).length;
      const inClassCount = studentSubs.filter(s => s.type.toLowerCase().includes('in-class')).length;
      const bonusCount = studentSubs.filter(s => s.type.toLowerCase().includes('bonus')).length;

      stage.innerHTML = `
        <div class="profile-banner">
          <button class="btn-back-home" onclick="goHome()">← Back to Home (Reset Filters)</button>
          <div class="profile-header" style="margin-top: 10px;">
            <div class="profile-title-area">
              <span class="chip chip-group">Group ${escapeHtml(groupNum)}</span>
              <h1>${escapeHtml(studentName)}</h1>
              <div class="type-breakdown">
                <span class="type-count-pill">🏠 ${homeCount} Home Challenges</span>
                <span class="type-count-pill">💻 ${inClassCount} In-Class Projects</span>
                <span class="type-count-pill">⭐ ${bonusCount} Bonus Projects</span>
              </div>
            </div>
            <div style="text-align: right;">
              <div class="stat-value" style="font-size: 32px;">${studentSubs.length}</div>
              <div class="stat-label">Total Projects</div>
            </div>
          </div>
        </div>

        <div class="section-title-wrap">
          <h2 class="section-title">Project Portfolio (Oldest → Newest)</h2>
        </div>

        <div class="portfolio-stack">
          ${journeySubs.map(sub => {
            const hasCode = Boolean(sub.code);
            const photoIds = sub.photoIds || [];
            const hasPhotos = photoIds.length > 0;
            const isBoth = hasCode && hasPhotos;

            return `
              <article class="submission-card">
                <div class="sub-card-header">
                  <div>
                    <h3 class="sub-card-title">${escapeHtml(sub.activityName)}</h3>
                    <div class="sub-card-date">Submitted: ${escapeHtml(sub.timestamp)}</div>
                  </div>
                  <div>
                    ${getTypeChip(sub.type)}
                  </div>
                </div>

                ${sub.description ? `
                  <div class="sub-description">${escapeHtml(sub.description)}</div>
                ` : ''}

                ${(hasCode || hasPhotos) ? `
                  <div class="sub-content-grid ${isBoth ? 'has-both' : ''}">
                    
                    ${hasCode ? `
                      <div class="code-block-wrap">
                        <div class="code-header">
                          <span>PYTHON CODE</span>
                          <button class="btn-copy" onclick="copyCode(this)">Copy Code</button>
                        </div>
                        <pre class="code-block"><code>${escapeHtml(sub.code)}</code></pre>
                      </div>
                    ` : ''}

                    ${hasPhotos ? `
                      <div class="side-photo-box">
                        <div class="side-photo-title">📷 Media &amp; Attachments (${photoIds.length})</div>
                        <div class="photo-gallery-side">
                          ${photoIds.map(id => `
                            <div class="photo-thumb-wrapper" id="wrap-${id}" data-id="${id}"></div>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}

                  </div>
                ` : ''}
              </article>
            `;
          }).join('')}
        </div>
      `;

      journeySubs.forEach(sub => (sub.photoIds || []).forEach(id => initMediaThumb(id)));
    }

    /* ==========================================================================
       VIEW C: GROUP PROFILE VIEW
       ========================================================================== */
    function renderGroupProfile(groupNum, data) {
      const groupSubs = data.filter(s => s.group === groupNum);
      const studentNames = [...new Set(groupSubs.map(s => s.name))].sort();

      stage.innerHTML = `
        <div class="profile-banner" style="border-left-color: var(--san3a-teal);">
          <button class="btn-back-home" onclick="goHome()">← Back to Home (Reset Filters)</button>
          <div class="profile-header" style="margin-top: 10px;">
            <div class="profile-title-area">
              <span class="chip chip-group">Group Profile</span>
              <h1>Group ${escapeHtml(groupNum)}</h1>
            </div>
            <div style="display: flex; gap: 24px; text-align: right;">
              <div>
                <div class="stat-value" style="font-size: 28px;">${studentNames.length}</div>
                <div class="stat-label">Makers</div>
              </div>
              <div>
                <div class="stat-value" style="font-size: 28px;">${groupSubs.length}</div>
                <div class="stat-label">Submissions</div>
              </div>
            </div>
          </div>
        </div>

        <div class="section-title-wrap">
          <h2 class="section-title">Group ${escapeHtml(groupNum)} Students</h2>
        </div>

        ${studentNames.length === 0 ? `
          <div class="empty-state">
            <h3>No Makers Found</h3>
            <p>No student submissions found for Group ${escapeHtml(groupNum)}.</p>
          </div>
        ` : `
          <div class="students-grid">
            ${studentNames.map(name => {
              const subs = groupSubs.filter(s => s.name === name);
              const latest = subs[subs.length - 1];
              return `
                <div class="student-card" onclick="selectStudent('${escapeJs(name)}', '${escapeJs(groupNum)}')">
                  <div class="student-card-name">${escapeHtml(name)}</div>
                  <div class="student-card-meta">${subs.length} total projects</div>
                  <div style="font-size: 13px; color: var(--san3a-maroon-d);">
                    <strong>Latest:</strong> ${escapeHtml(latest ? latest.activityName : 'N/A')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    /* ==========================================================================
       MEDIA TYPE DETECTION & RENDER ENGINE
       ========================================================================== */
    // Drive's generic thumbnail/uc endpoints return a valid JPEG for almost any
    // file type, including videos (video frame or a generic file icon) - so a
    // successful <img> load does NOT mean the file is a photo. To tell photos
    // and videos apart we probe the actual file bytes with a <video> element:
    // if the browser can read video metadata from it, it's a video; otherwise
    // we treat it as an image.
    function initMediaThumb(id) {
      const wrapper = document.getElementById(`wrap-${id}`);
      if (!wrapper) return;

      const probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.muted = true;
      probe.style.display = 'none';

      let settled = false;

      const finish = (isVideo) => {
        if (settled) return;
        settled = true;
        probe.remove();
        isVideo ? renderVideoThumb(wrapper, id) : renderImageThumb(wrapper, id);
      };

      probe.addEventListener('loadedmetadata', () => finish(true));
      probe.addEventListener('error', () => finish(false));
      // Safety timeout in case neither event fires (e.g. blocked/slow network)
      setTimeout(() => finish(false), 4000);

      probe.src = `https://drive.google.com/uc?export=download&id=${id}`;
      document.body.appendChild(probe);
    }

    function renderImageThumb(wrapper, id) {
      wrapper.innerHTML = `
        <img class="photo-thumb-side"
             src="https://lh3.googleusercontent.com/d/${id}=w1000"
             alt="Project media preview"
             data-id="${id}"
             data-try="1"
             onclick="openLightbox(this.src, '${id}', false)"
             onerror="handleImgError(this, '${id}')">
      `;
    }

    function renderVideoThumb(wrapper, id) {
      wrapper.classList.add('video-thumb-wrapper');
      wrapper.setAttribute('onclick', `openLightbox('', '${id}', true)`);
      wrapper.innerHTML = `
        <img class="photo-thumb-side" src="https://drive.google.com/thumbnail?id=${id}&sz=w1000" alt="Video preview" onerror="this.style.display='none';">
        <div class="video-badge"><span class="video-badge-icon">▶</span></div>
      `;
    }

    function handleImgError(img, id) {
      const tryStage = parseInt(img.getAttribute('data-try') || '1', 10);

      if (tryStage === 1) {
        // Fallback Stage 1: Google Drive Thumbnail API
        img.setAttribute('data-try', '2');
        img.src = `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
      } else if (tryStage === 2) {
        // Fallback Stage 2: Direct UC Export View
        img.setAttribute('data-try', '3');
        img.src = `https://drive.google.com/uc?export=view&id=${id}`;
      } else {
        // Fallback Stage 3: still not loadable as an image - show a clean link
        const wrapper = img.parentElement;
        if (wrapper) {
          wrapper.innerHTML = `
            <a href="https://drive.google.com/open?id=${id}" target="_blank" class="media-file-link" title="Open file in Google Drive">
              <span>📎</span> View File
            </a>
          `;
        }
      }
    }

    /* ==========================================================================
       UTILITIES & HELPERS
       ========================================================================== */
    function getTypeChip(type) {
      const cleanType = (type || '').toLowerCase();
      if (cleanType.includes('home')) return `<span class="chip chip-home">Home Challenge</span>`;
      if (cleanType.includes('bonus')) return `<span class="chip chip-bonus">Bonus</span>`;
      if (cleanType.includes('in-class') || cleanType.includes('in class')) return `<span class="chip chip-inclass">In-Class Project</span>`;
      return `<span class="chip chip-other">${escapeHtml(type || 'Other')}</span>`;
    }

    function selectStudent(name, group) {
      state.group = group;
      state.name = name;
      groupSelect.value = group;
      updateNameDropdown();
      nameSelect.value = name;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyCode(btn) {
      const codeBlock = btn.parentElement.nextElementSibling.querySelector('code');
      if (!codeBlock) return;

      navigator.clipboard.writeText(codeBlock.innerText).then(() => {
        const orig = btn.innerText;
        btn.innerText = "✓ Copied!";
        setTimeout(() => btn.innerText = orig, 2000);
      });
    }

    function openLightbox(url, id, isVideo) {
      if (isVideo && id) {
        lightboxImg.style.display = 'none';
        lightboxImg.src = '';
        lightboxVideo.src = `https://drive.google.com/file/d/${id}/preview`;
        lightboxVideo.style.display = 'block';
      } else {
        lightboxVideo.style.display = 'none';
        lightboxVideo.src = '';
        lightboxImg.style.display = 'block';
        lightboxImg.src = url;
      }

      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxVideo.src = '';
      lightboxVideo.style.display = 'none';
      lightboxImg.style.display = 'block';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
