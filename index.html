<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120810">
  <meta name="color-scheme" content="dark">
  <title>Code &amp; Create — Student Projects Portfolio</title>
  
  <!-- Fonts: Montserrat (Headlines), Arvo (Sub-headlines), Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- PapaParse for Quote/Newline-Aware CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="appShell">
  <!-- Header & Brand Lockup -->
  <header>
    <div class="container">
      <div class="header-top">
        <div class="brand-lockup">
          <div class="logo-slot">
            <img src="../images/San3a-Academy-logo.png" alt="San3a Academy Logo" onerror="this.style.display='none'">
          </div>
          <div class="brand-text">
            <h1>CODE &amp; <span>CREATE</span></h1>
            <div class="brand-tagline">ZERO TO MAKER • PORTFOLIO</div>
          </div>
        </div>
        <div class="refresh-meta">
          <button class="btn-action btn-secondary" onclick="goHome()">🏠 Home View</button>
          <span id="lastUpdated">Updating...</span>
          <button class="btn-action" id="refreshBtn">🔄 Refresh</button>
          <a href="https://forms.gle/xLrEQwgiiLGuLKMG8" target="_blank" rel="noreferrer" class="btn-action" style="background: linear-gradient(135deg, var(--san3a-red), var(--san3a-wine)); box-shadow: 0 4px 14px rgba(207, 32, 39, 0.35);">
            🚀 Submit Student Project
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Filters & Controls Bar -->
    <section class="controls-card">
      <div class="controls-grid">
        <div class="control-group">
          <label for="groupSelect">1. Group Number</label>
          <select id="groupSelect">
            <option value="ALL">All Groups</option>
          </select>
        </div>
        <div class="control-group">
          <label for="nameSelect">2. Student Name</label>
          <select id="nameSelect">
            <option value="ALL">All Students</option>
          </select>
        </div>
        <div class="control-group">
          <label for="typeSelect">3. Activity Type</label>
          <select id="typeSelect">
            <option value="ALL">All Activity Types</option>
          </select>
        </div>
        <div class="control-group">
          <label for="searchInput">4. Search Projects</label>
          <input type="text" id="searchInput" placeholder="Search keywords...">
        </div>
        <div class="control-group">
          <label>5. Project Submission</label>
          <a href="https://forms.gle/xLrEQwgiiLGuLKMG8" target="_blank" rel="noreferrer" class="btn-action" style="height: 42px; justify-content: center; border-radius: 10px; font-size: 13px; background: linear-gradient(135deg, var(--san3a-red), var(--san3a-wine)); box-shadow: 0 4px 12px rgba(207, 32, 39, 0.25);">
            ➕ Submit Project
          </a>
        </div>
      </div>
    </section>

    <!-- Main Stage View -->
    <div id="dashboardStage"></div>

  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img id="lightboxImg" src="" alt="Submission photo preview">
    <iframe id="lightboxVideo" src="" style="display:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
